<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7e5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feb47b;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; }
      .subtitle { font: 20px sans-serif; fill: white; opacity: 0.9; }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.02); }
        100% { transform: scale(1); }
      }
      .animated-bg {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>
  <rect class="animated-bg" width="100%" height="100%" rx="15" fill="url(#grad1)"/>
  <text x="50%" y="45%" text-anchor="middle" class="title">Awesome Influencer Marketing Platform</text>
  <text x="50%" y="65%" text-anchor="middle" class="subtitle">A curated list of awesome tools &amp; resources</text>
</svg>
